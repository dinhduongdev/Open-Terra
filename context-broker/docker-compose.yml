# ==============================================================================
# Open Terra - Context Broker (FIWARE) Docker Compose
# ==============================================================================
# This file runs the FIWARE Orion-LD Context Broker stack:
#   - orion: Orion-LD Context Broker (NGSI-LD API)
#   - mongo-db: MongoDB (Orion database)
#   - timescale-db: TimescaleDB (Temporal data storage)
#   - ld-context: JSON-LD context server
#   - mintaka: Temporal query service
#   - mosquitto: MQTT broker
#   - iot-agent: IoT Agent UltraLight 2.0
#
# Prerequisites:
#   - Network 'open-terra-network' must exist
#
# Usage:
#   docker compose up -d
#
# Ports (Internal - accessed via network):
#   - Orion: 1026 (NGSI-LD API)
#   - IoT Agent: 4041 (North Port), 7896 (South Port)
#   - MQTT: 1883 (MQTT), 9001 (WebSocket)
#   - MongoDB: 27017
#   - TimescaleDB: 5432
#   - Mintaka: 8080
#   - LD Context: 80
# ==============================================================================

services:
  orion:
    platform: linux/amd64
    image: fiware/orion-ld:latest
    hostname: orion
    container_name: fiware-orion
    restart: unless-stopped
    depends_on:
      mongo-db:
        condition: service_healthy
      timescale-db:
        condition: service_healthy
    networks:
      - open-terra-network
    expose:
      - "1026"
    environment:
      - ORIONLD_TROE=TRUE
      - ORIONLD_TROE_USER=orion
      - ORIONLD_TROE_PWD=orion
      - ORIONLD_TROE_HOST=timescale-db
      - ORIONLD_MONGO_HOST=mongo-db
      - ORIONLD_MULTI_SERVICE=TRUE
      - ORIONLD_DISABLE_FILE_LOG=TRUE
    command: -dbhost mongo-db -logLevel WARN -troePoolSize 10 -forwarding
    healthcheck:
      test: curl --fail -s http://orion:1026/version || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo-db:
    image: mongo:4.2
    hostname: mongo-db
    container_name: db-mongo
    restart: unless-stopped
    expose:
      - "27017"
    networks:
      - open-terra-network
    volumes:
      - mongo-db:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 5s

  ld-context:
    image: httpd:alpine
    hostname: context
    container_name: fiware-ld-context
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./ld-context:/usr/local/apache2/htdocs:ro
    networks:
      - open-terra-network
    healthcheck:
      test: wget --spider -q http://localhost/open-terra-context.jsonld || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mintaka:
    platform: linux/amd64
    image: fiware/mintaka:latest
    hostname: mintaka
    container_name: fiware-mintaka
    restart: unless-stopped
    depends_on:
      timescale-db:
        condition: service_started
      orion:
        condition: service_started
    environment:
      - DATASOURCES_DEFAULT_HOST=timescale-db
      - DATASOURCES_DEFAULT_USERNAME=orion
      - DATASOURCES_DEFAULT_PASSWORD=orion
      - DATASOURCES_DEFAULT_DATABASE=orion
      - DATASOURCES_DEFAULT_MAXIMUM_POOL_SIZE=2
      - ENDPOINTS_INFO_ENABLED=true
      - ENDPOINTS_INFO_SENSITIVE=false
    expose:
      - "8080"
    networks:
      - open-terra-network
    healthcheck:
      test: curl --fail -s http://mintaka:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  timescale-db:
    platform: linux/amd64
    image: timescale/timescaledb-ha:pg14-latest
    hostname: timescale-db
    container_name: db-timescale
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orion" ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: [ "postgres", "-c", "log_statement=none" ]
    expose:
      - "5432"
    networks:
      - open-terra-network
    volumes:
      - timescale-db:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:1.6.14
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    expose:
      - "1883"
      - "9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - open-terra-network

  iot-agent:
    platform: linux/amd64
    image: fiware/iotagent-ul:latest
    hostname: iot-agent
    container_name: fiware-iot-agent
    restart: unless-stopped
    depends_on:
      - mongo-db
      - mosquitto
      - orion
    networks:
      - open-terra-network
    expose:
      - "4041"
      - "7896"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_LOG_LEVEL=WARN
      - IOTA_TIMESTAMP=true
      - IOTA_AUTOCAST=true
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentul
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_DEFAULT_RESOURCE=
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=http://context/open-terra-context.jsonld
      - IOTA_FALLBACK_TENANT=openiot
      - IOTA_AMQP_DISABLED=true
    healthcheck:
      test: curl --fail -s http://iot-agent:4041/iot/about || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  open-terra-network:
    external: true

volumes:
  timescale-db:
  mongo-db:
  mongo-config:
