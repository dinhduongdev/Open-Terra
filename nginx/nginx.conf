# ==============================================================================
# Open Terra - Nginx Reverse Proxy Configuration
# ==============================================================================
# This configuration handles routing for:
# - backend.open-terra.io.vn → Backend API (port 8000)
# - dummy-iot.open-terra.io.vn → Dummy IoT UI (port 3000)
# - opendata.open-terra.io.vn → Orion Context Broker (port 1026)
# ==============================================================================

# ==============================================================================
# Backend API Server - sta-backend.open-terra.io.vn
# ==============================================================================
# HTTP to HTTPS redirect
server {
    listen 80;
    server_name sta-backend.open-terra.io.vn;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name sta-backend.open-terra.io.vn;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/sta-backend.open-terra.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sta-backend.open-terra.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DNS resolver for Docker (allows dynamic resolution)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Set upstream dynamically
    set $backend_upstream http://backend:8000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Client max body size (for file uploads)
    client_max_body_size 10M;

    location / {
        # CORS headers for frontend
        add_header Access-Control-Allow-Origin "https://open-terra.io.vn" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://open-terra.io.vn" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

