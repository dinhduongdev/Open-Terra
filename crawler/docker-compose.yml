# ==============================================================================
# Open Terra - Crawler Service Docker Compose
# ==============================================================================
# This file runs the Crawler service with its dependencies:
#   - crawler: FastAPI crawler service
#   - worker: ARQ background worker
#   - db: PostgreSQL database
#   - redis: Redis cache
#
# Prerequisites:
#   - Network 'open-terra-network' must exist
#
# Usage:
#   docker compose up -d
# ==============================================================================

services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-terra-crawler
    restart: unless-stopped
    # Production: Use Gunicorn
    command: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001
    # Development: Use Uvicorn with reload
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - ./src/.env
    expose:
      - "8001"
    depends_on:
      - db
      - redis
    # Development: Mount volumes for hot reload
    # volumes:
    #   - ./src/app:/app/src/app
    #   - ./src/.env:/app/src/.env
    networks:
      - open-terra-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-terra-crawler-worker
    restart: unless-stopped
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env
    depends_on:
      - db
      - redis
    # Development: Mount volumes for hot reload
    # volumes:
    #   - ./src/app:/app/src/app
    #   - ./src/.env:/app/src/.env
    networks:
      - open-terra-network

  db:
    image: postgres:13
    container_name: open-terra-crawler-db
    restart: unless-stopped
    env_file:
      - ./src/.env
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - open-terra-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: open-terra-crawler-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - open-terra-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:


networks:
  open-terra-network:
    external: true
