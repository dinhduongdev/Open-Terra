services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-terra-crawler
    # -------- Both of the following commands should be commented to run with nginx --------

    # -------- replace with comment to run with gunicorn --------
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    command: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001
    env_file:
      - ./src/.env
    # -------- replace ports with expose if you are using nginx --------
    # ports:
    #    - "8001:8001"
    expose:
      - "8001"
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/app/src/app
      - ./src/.env:/app/src/.env
    networks:
      - open-terra-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-terra-crawler-worker
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/app/src/app
      - ./src/.env:/app/src/.env
    networks:
      - open-terra-network

  db:
    image: postgres:13
    container_name: open-terra-crawler-db
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - open-terra-network

  redis:
    image: redis:alpine
    container_name: open-terra-crawler-redis
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - open-terra-network

  #-------- uncomment to run with nginx --------
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - crawler
    networks:
      - open-terra-network
  # -------- uncomment to create first superuser --------
  # create_superuser:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./src/.env
  #   depends_on:
  #     - db
  #     - web
  #   command: python -m src.scripts.create_first_superuser
  #   volumes:
  #     - ./src:/app/src
  #-------- uncomment to run tests --------
  # pytest:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile 
  #   env_file:
  #     - ./src/.env
  #   depends_on:
  #     - web
  #     - redis
  #   command: python -m pytest ./tests
  #   volumes:
  #     - .:/app

  #-------- uncomment to create first tier --------
  # create_tier:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./src/.env
  #   depends_on:
  #     - create_superuser
  #     - db
  #     - web
  #   command: python -m src.scripts.create_first_tier
  #   volumes:
  #     - ./src:/app/src

volumes:
  postgres-data:
  redis-data:


networks:
  open-terra-network:
    external: true
